name: Build Blender Assets & Deploy Web Game

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Headless Blender & NumPy
        run: |
          sudo apt-get update
          sudo apt-get install -y blender python3-numpy

      - name: Generate 3D GLB Models via Blender Python
        run: |
          blender --background --python-exit-code 1 --python blender-scripts/build_all.py
          ls -lh public/models/
          test -s public/models/earth_cutaway.glb
          test -s public/models/drill_pod.glb
          test -s public/models/rock_samples.glb

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install frontend dependencies
        run: npm install

      - name: Build Vite + TypeScript bundle
        run: npm run build

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
